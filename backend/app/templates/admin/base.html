<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Obstetra{% endblock %}</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e5e7eb;
            --text: #1f2937;
            --muted: #6b7280;
            --bg: #fff;
            --bg-soft: #f9fafb;
            --error-bg: #fee2e2;
            --error-border: #fca5a5;
            --ok-bg: #dcfce7;
            --ok-border: #86efac;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            max-width: 860px; margin: 0 auto; padding: 1.5em 1em;
            color: var(--text); background: var(--bg); line-height: 1.5;
        }
        nav {
            display: flex; gap: 1.5em; align-items: center;
            margin-bottom: 1.5em; padding-bottom: 1em; border-bottom: 1px solid var(--border);
        }
        nav .brand { font-weight: 600; font-size: 1.1em; }
        nav a { color: var(--primary); text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        h1 { margin-top: 0; font-size: 1.5em; }
        h2 { font-size: 1.1em; margin: 1.5em 0 0.5em; color: var(--muted); font-weight: 600; }
        fieldset {
            border: 1px solid var(--border); border-radius: 6px;
            margin-bottom: 1em; padding: 1em 1.25em;
        }
        legend { padding: 0 0.5em; font-weight: 600; font-size: 0.95em; }
        label { display: block; margin-bottom: 0.85em; }
        label > span {
            display: block; font-size: 0.88em; color: var(--muted);
            margin-bottom: 0.25em; font-weight: 500;
        }
        input[type=text], input[type=tel], input[type=date], input[type=number],
        textarea, select {
            width: 100%; padding: 0.55em 0.7em;
            border: 1px solid var(--border); border-radius: 4px;
            font-size: 0.95em; font-family: inherit;
            background: white; color: var(--text);
        }
        input:focus, textarea:focus, select:focus {
            outline: 2px solid var(--primary); outline-offset: -1px; border-color: var(--primary);
        }
        input[readonly] { background: var(--bg-soft); cursor: not-allowed; }
        textarea { min-height: 4.5em; resize: vertical; }
        .row { display: flex; gap: 1em; flex-wrap: wrap; }
        .row > label { flex: 1; min-width: 150px; }
        .check-row label { display: flex; align-items: center; gap: 0.5em; }
        .check-row label > span { display: inline; margin: 0; }
        button.primary {
            background: var(--primary); color: white; border: none;
            padding: 0.7em 1.6em; border-radius: 4px; cursor: pointer;
            font-size: 1em; font-weight: 500;
        }
        button.primary:hover { background: var(--primary-hover); }
        .alert { padding: 0.7em 1em; border-radius: 4px; margin-bottom: 1em; }
        .alert.error { background: var(--error-bg); border: 1px solid var(--error-border); color: #991b1b; }
        .alert.ok { background: var(--ok-bg); border: 1px solid var(--ok-border); color: #166534; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 0.6em 0.75em; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
        th { background: var(--bg-soft); font-size: 0.88em; color: var(--muted); font-weight: 600; }
        tr:hover { background: var(--bg-soft); }
        td a { color: var(--primary); text-decoration: none; }
        td a:hover { text-decoration: underline; }
        .hint { font-size: 0.85em; color: var(--muted); margin-top: 0.3em; }
        .actions { display: flex; gap: 0.75em; align-items: center; margin-top: 1em; }
        .actions a { color: var(--muted); }
        .badge {
            display: inline-block; padding: 0.15em 0.6em; border-radius: 12px;
            font-size: 0.8em; font-weight: 500;
        }
        .badge-habitual { background: #dbeafe; color: #1e40af; }
        .badge-alto { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">Obstetra · Admin</span>
        <a href="/admin/">Pacientes</a>
        <a href="/admin/novo">+ Nova paciente</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
